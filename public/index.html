<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d14">
  <title>Futursia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <div class="bg-orb bg-orb-a"></div>
  <div class="bg-orb bg-orb-b"></div>
  <main class="app-shell">
    <nav class="tabs">
      <button class="tab is-active" data-panel="dashboardPanel" type="button">Dashboard</button>
      <button class="tab" data-panel="tickerPanel" type="button">Ticker</button>
    </nav>

    <section class="panel is-active" id="dashboardPanel">
      <div class="panel-head">
        <h2>Top Movers</h2>
        <span id="dashboardUpdated">-</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Stock</th>
              <th>Price</th>
              <th>Change $</th>
              <th>Change %</th>
              <th>High</th>
              <th>Low</th>
            </tr>
          </thead>
          <tbody id="moversBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="tickerPanel">
      <div class="panel-head">
        <h2 id="tickerName">-</h2>
        <span id="tickerUpdated">-</span>
      </div>
      <div class="ticker-controls">
        <input id="tickerSearch" class="ticker-search" type="search" placeholder="Search by symbol or company" autocomplete="off">
        <select id="tickerSelect" class="ticker-select"></select>
      </div>

      <div class="stats-grid">
        <article class="stat-card">
          <h3>Price</h3>
          <p id="priceValue">-</p>
          <small id="priceChange">-</small>
        </article>
        <article class="stat-card">
          <h3>Next 3 hours</h3>
          <p id="forecastDirection">-</p>
          <small id="forecastReturn">-</small>
        </article>
        <article class="stat-card">
          <h3>Confidence</h3>
          <p id="forecastConfidence">-</p>
          <small id="forecastTarget">-</small>
        </article>
        <article class="stat-card">
          <h3>Market</h3>
          <p id="marketStatus">-</p>
          <small id="lastTrade">-</small>
        </article>
      </div>

      <div class="chart-card">
        <div class="chart-head">
          <h3>Price chart</h3>
          <div class="chart-tools">
            <button id="zoomOutButton" class="chart-tool-btn" type="button">-</button>
            <button id="resetButton" class="chart-tool-btn" type="button">Reset</button>
            <button id="zoomInButton" class="chart-tool-btn" type="button">+</button>
          </div>
        </div>
        <svg id="priceChart"></svg>
      </div>
    </section>
  </main>

  <script src="/site.js"></script>
</body>
</html>
